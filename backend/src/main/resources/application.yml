server:
  port: 8080

spring:
  application:
    name: comunidade-tech-api
  threads:
    virtual:
      enabled: true # Java 21 Project Loom (Virtual Threads ativadas)

  datasource:
    url: jdbc:h2:mem:comunidadedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

# Documentação OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Configurações do App
app:
  cors:
    allowed-origins: "http://localhost:4200,https://comunidade.tech.lucivaldo.cloud"
